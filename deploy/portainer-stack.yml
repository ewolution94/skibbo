# The Skibbo stack Portainer runs on the NAS.
#
# This is deliberately NOT the repo's docker-compose.yml. That one carries `build: .`,
# which would make Portainer compile the app on the NAS instead of pulling the image
# CI already published. Paste this into Portainer's stack editor (or point a
# Git-backed stack at this file), never that one.
#
# Auto-updates come from the shared Watchtower stack (development/.claude/skills/portainer/watchtower/),
# which only touches containers carrying the label below. With it, a push to `release`
# is the entire deploy. A deploy ends any table in progress (tables live in memory); solo games
# live in each page and carry on.

services:
  skibbo:
    image: ghcr.io/ewolution94/skibbo:latest
    container_name: skibbo
    restart: unless-stopped
    ports:
      # The port from the workspace's registry (development/.claude/skills/portainer/ports.json).
      - "6800:6800"
    environment:
      - PORT=6800
      - TZ=Europe/Berlin
      # Visit counts: /_e and /_e.js are forwarded to Census over the `ewolution` network.
      # Remove the line to stop counting; the page doesn't change either way.
      - SKIBBO_CENSUS=http://census:4901
    networks:
      # The shared network Census listens on. It must exist before this stack is created
      # (Portainer → Networks → `ewolution`).
      - ewolution
    healthcheck:
      # Every ~10 minutes, each container on its own interval so they never line up (plans/nas-load.md).
      interval: 775s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      # The opt-in the shared Watchtower looks for (it runs with
      # WATCHTOWER_LABEL_ENABLE=true, so unlabelled containers are never touched).
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  ewolution:
    external: true
