name: CI

# Runs on pull requests, and is the gate docker-publish.yml calls before it publishes
# anything, so the checks guarding a PR and the checks guarding a deploy can't drift apart.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The built page and the tables, served by the real production server.
      - name: Smoke test the production server
        run: |
          PORT=6399 node server/server.mjs &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:6399/healthz && break; sleep 0.5; done
          base=http://127.0.0.1:6399
          curl -sf $base/ | grep -q '<title>Skibbo</title>'
          curl -sf $base/KXPT | grep -q '<title>Skibbo</title>'
          curl -sf $base/solo | grep -q '<title>Skibbo</title>'
          curl -sI $base/ | grep -qi "content-security-policy: default-src 'self'"
          curl -sI $base/ | grep -qi "cache-control: no-cache"
          curl -sf $base/manifest.webmanifest | grep -q '"name": "Skibbo"'
          curl -sf -o /dev/null $base/sw.js
          curl -sf -o /dev/null $base/icon.svg
          asset=$(curl -s $base/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sI "$base$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $base/)" = 405
          # The API never falls through to the page.
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/api/nothing)" = 404
          curl -sf $base/api/config | grep -q '"clocks":\["off"'
          curl -sf $base/api/config | grep -q '"stocks":\[10,20,30\]'
          # A table with a player, a guest and a bot.
          room=$(curl -sf -X POST -H 'content-type: application/json' --data '{"name":"CI","avatar":[1,2,3]}' $base/api/rooms)
          code=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).code')
          token=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          hostId=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).player')
          post() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-skibbo-token: $token" --data "$2" $base/api/rooms/$code/$1; }
          guest=$(curl -sf -X POST -H 'content-type: application/json' --data '{"name":"Zwei"}' $base/api/rooms/$code/join)
          echo "$guest" | grep -q '"player"'
          guestId=$(echo "$guest" | node -pe 'JSON.parse(require("fs").readFileSync(0)).player')
          test "$(post bot '{"add":true}')" = 204
          test "$(post settings '{"rules":{"stock":10,"target":500}}')" = 204
          test "$(post start '{}')" = 204
          # Each page gets its own view: its own hand, the others' only as a count.
          curl -s -N --max-time 2 "$base/api/rooms/$code/events?p=$hostId" > host.txt || true
          curl -s -N --max-time 2 "$base/api/rooms/$code/events?p=$guestId" > guest.txt || true
          grep -q '"phase":"play"' guest.txt
          view() { grep -m1 '^data: ' "$1" | sed 's/^data: //'; }
          view host.txt > host.json
          view guest.txt > guest.json
          node -e '
            const host = JSON.parse(require("fs").readFileSync("host.json")).game;
            const guest = JSON.parse(require("fs").readFileSync("guest.json")).game;
            if (host.seat === guest.seat) throw new Error("same seat");
            const theirs = new Set(guest.state.hand);
            if (host.state.hand.some((id) => theirs.has(id))) throw new Error("a hand in two views");
            if (guest.state.seats[host.seat].hand !== host.state.hand.length) throw new Error("the count is off");
          '
          turn=$(node -pe 'JSON.parse(require("fs").readFileSync("host.json")).game.state.turn')
          seat=$(node -pe 'JSON.parse(require("fs").readFileSync("host.json")).game.seat')
          if [ "$turn" = "$seat" ]; then
            card=$(node -pe 'JSON.parse(require("fs").readFileSync("host.json")).game.state.hand[0]')
            test "$(post move '{"move":{"type":"end"}}')" = 409
            body="{\"move\":{\"type\":\"discard\",\"card\":$card,\"slot\":0}}"
            test "$(post move "$body")" = 204
          else
            test "$(post move '{"move":{"type":"end"}}')" = 409
          fi
          test "$(post move '{"move":{"type":"nonsense"}}')" -ge 400
          # The Census forwarder is wired in; without SKIBBO_CENSUS it answers locally.
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/_e.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '{}' $base/_e)" = 204
